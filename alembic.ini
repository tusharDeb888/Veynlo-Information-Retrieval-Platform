# Alembic Configuration File
# Multi-Tenant RAG Knowledge Assurance Platform

[alembic]
# Path to migration scripts.
script_location = migrations

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Truncate revision to this length in $%(rev)s format.
truncate_slug_length = 40

# Set to 'true' to run the environment during 'revision --autogenerate'.
revision_environment = false

# Timezone to use when rendering the date in the migration file.
timezone = UTC

# sys.path prepending — allows the migration env to find app modules.
prepend_sys_path = .

# Version path separator; default is OS-specific.
version_path_separator = os

# The output encoding used when revision files are written.
output_encoding = utf-8

# The SQLAlchemy URL is set programmatically in env.py from the
# DATABASE_URL / DATABASE_URL_SYNC environment variable.
# sqlalchemy.url is left empty here on purpose.
sqlalchemy.url =

[post_write_hooks]
# No hooks by default.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
