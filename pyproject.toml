[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-assurance"
version = "1.0.0"
description = "Multi-Tenant RAG-Based Knowledge Assurance Platform"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "RAG Platform Team"},
]

dependencies = [
    # ── Web Framework ────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # ── Database & ORM ───────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # ── Task Queue ───────────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # ── Object Storage ───────────────────────────────────────────
    "aioboto3>=13.0.0",
    "boto3>=1.34.0",

    # ── Vector Database ──────────────────────────────────────────
    "qdrant-client>=1.11.0",

    # ── Embeddings & Reranking ───────────────────────────────────
    "sentence-transformers>=3.0.0",

    # ── Authentication ───────────────────────────────────────────
    "firebase-admin>=6.5.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",

    # ── Data Validation ──────────────────────────────────────────
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0",

    # ── Document Parsing ─────────────────────────────────────────
    "pypdfium2>=4.28.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",

    # ── Utilities ────────────────────────────────────────────────
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools]
packages = ["app", "app.core", "app.models", "app.schemas", "app.services", "app.workers", "app.api", "app.api.v1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: marks tests requiring full Docker stack",
    "unit: marks fast unit tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008"] # FastAPI dependencies are intentionally defaults.

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
